name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # PRs para a main rodam lint, testes e build (sem publicar), para ver o
  # resultado no próprio PR antes do merge.
  pull_request:
    branches: [main]
  workflow_dispatch:

# Permissões necessárias para publicar no GitHub Pages via Actions.
permissions:
  contents: read
  pages: write
  id-token: write

# Um run por ref; cancela runs antigos ainda em andamento. Agrupar por ref
# evita que o run de um PR cancele um deploy da main (e vice-versa).
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npm run build

      # Daqui para baixo é só publicação — não roda em PR.

      # SPA fallback: GitHub Pages serve 404.html preservando a URL,
      # então uma cópia do index.html faz os links diretos (deep links) funcionarem.
      - if: github.event_name != 'pull_request'
        run: cp dist/index.html dist/404.html

      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
